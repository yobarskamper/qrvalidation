<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Event QR Check-in
</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 20px;

  background: #f5f5f5;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


.container {

  max-width: 520px;

  margin: auto;

}


.card {

  background: white;

  border-radius: 24px;

  padding: 24px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.08);

}


h1 {

  text-align: center;

  margin-top: 0;

}


label {

  display: block;

  margin-top: 15px;

  margin-bottom: 6px;

  font-weight: bold;

}


input {

  width: 100%;

  padding: 14px;

  border:
    1px solid #ccc;

  border-radius: 10px;

  font-size: 16px;

}


button {

  width: 100%;

  padding: 16px;

  border: none;

  border-radius: 12px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}


.primary {

  background: #111;

  color: white;

  margin-top: 20px;

}


.secondary {

  background: #e8e8e8;

  color: #111;

  margin-top: 12px;

}


#reader {

  width: 100%;

  margin-top: 20px;

}


.status {

  margin-top: 20px;

  padding: 25px;

  border-radius: 18px;

  text-align: center;

  display: none;

}


.status.valid {

  display: block;

  background: #e7f8ec;

  border:
    3px solid #22a447;

}


.status.duplicate {

  display: block;

  background: #fff5d6;

  border:
    3px solid #e6b800;

}


.status.invalid {

  display: block;

  background: #ffe7e7;

  border:
    3px solid #d33;

}


.status.error {

  display: block;

  background: #eeeeee;

  border:
    3px solid #555;

}


.status h2 {

  margin-top: 0;

  font-size: 28px;

}


.registration-id {

  font-size: 25px;

  font-weight: bold;

  margin: 15px 0;

}


.participant {

  margin-top: 15px;

  text-align: left;

  background: white;

  border-radius: 10px;

  padding: 12px;

}


.participant-row {

  padding: 6px 0;

  border-bottom:
    1px solid #eee;

}


.participant-row:last-child {

  border-bottom: none;

}


.small {

  color: #666;

  font-size: 13px;

  margin-top: 15px;

  text-align: center;

}


.hidden {

  display: none;

}

</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>
🎟️ Event QR Check-in
</h1>


<label for="staffName">
Staff Name
</label>

<input
  id="staffName"
  type="text"
  placeholder="Enter staff name"
  autocomplete="name"
>


<label for="staffPin">
Staff PIN
</label>

<input
  id="staffPin"
  type="password"
  placeholder="Enter staff PIN"
>


<button
  id="startButton"
  class="primary"
>
Start Scanner
</button>


<div
  id="reader"
></div>


<div
  id="status"
  class="status"
>


<h2 id="statusTitle">
</h2>


<div
  id="statusMessage"
>
</div>


<div
  id="registrationId"
  class="registration-id"
>
</div>


<div
  id="participant"
  class="participant hidden"
>
</div>


</div>


<button
  id="nextButton"
  class="secondary hidden"
>
Scan Next Participant
</button>


<p class="small">

Camera access is required for QR scanning.

</p>


</div>

</div>


<script>


/****************************************************
 * CONFIGURATION
 ****************************************************/

const API_URL =
  "https://rapid-moon-4405.yobarskamper.workers.dev";


/****************************************************
 * GLOBALS
 ****************************************************/

let scanner =
  null;


let scannerRunning =
  false;


let processingScan =
  false;


/****************************************************
 * ELEMENTS
 ****************************************************/

const staffNameInput =
  document.getElementById(
    "staffName"
  );


const staffPinInput =
  document.getElementById(
    "staffPin"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const nextButton =
  document.getElementById(
    "nextButton"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const statusTitle =
  document.getElementById(
    "statusTitle"
  );


const statusMessage =
  document.getElementById(
    "statusMessage"
  );


const registrationIdBox =
  document.getElementById(
    "registrationId"
  );


const participantBox =
  document.getElementById(
    "participant"
  );


/****************************************************
 * START SCANNER
 ****************************************************/

startButton.addEventListener(
  "click",
  async function() {

    const staffName =
      staffNameInput.value.trim();


    const staffPin =
      staffPinInput.value;


    if (!staffName) {

      alert(
        "Please enter Staff Name."
      );

      staffNameInput.focus();

      return;

    }


    if (!staffPin) {

      alert(
        "Please enter Staff PIN."
      );

      staffPinInput.focus();

      return;

    }


    startButton.disabled =
      true;


    try {

      await startScanner();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Camera could not be started.\n\n" +
        error.message
      );


      startButton.disabled =
        false;

    }

  }
);


/****************************************************
 * START CAMERA
 ****************************************************/

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  await scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.75;


        return {

          width:
            Math.floor(size),

          height:
            Math.floor(size)

        };

      }

    },

    onQrScanned,

    function(errorMessage) {

      // Ignore normal scanner errors.
      // These happen continuously while
      // the camera is looking for a QR.

    }

  );


  scannerRunning =
    true;


  startButton.classList.add(
    "hidden"
  );

}


/****************************************************
 * QR SCANNED
 ****************************************************/

async function onQrScanned(
  decodedText
) {

  if (
    processingScan
  ) {

    return;

  }


  const registrationId =
    String(
      decodedText || ""
    )
      .trim()
      .toUpperCase();


  /**************************************************
   * Validate QR locally first.
   **************************************************/

  if (
    !/^REG-[A-Z0-9]{8}$/
      .test(
        registrationId
      )
  ) {

    showResult({

      success: false,

      type:
        "INVALID",

      message:
        "This QR code is not a valid event registration QR."

    });


    return;

  }


  processingScan =
    true;


  await stopScanner();


  showVerifying(
    registrationId
  );


  try {

    const result =
      await checkIn(
        registrationId
      );


    showResult(
      result
    );


  } catch (error) {

    console.error(
      error
    );


    showResult({

      success: false,

      type:
        "ERROR",

      message:
        error.message ||
        "Unable to contact check-in server."

    });

  }

}


/****************************************************
 * SEND CHECK-IN REQUEST
 ****************************************************/

async function checkIn(
  registrationId
) {

  const staffName =
    staffNameInput.value.trim();


  const staffPin =
    staffPinInput.value;


  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function() {

        controller.abort();

      },
      15000
    );


  try {

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              registrationId:
                registrationId,

              staffName:
                staffName,

              pin:
                staffPin

            }),

          signal:
            controller.signal

        }

      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Server returned HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    return result;


  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      throw new Error(
        "The check-in server took too long to respond."
      );

    }


    throw error;


  } finally {

    clearTimeout(
      timeout
    );

  }

}


/****************************************************
 * VERIFYING DISPLAY
 ****************************************************/

function showVerifying(
  registrationId
) {

  statusBox.className =
    "status";


  statusBox.classList.add(
    "valid"
  );


  statusTitle.textContent =
    "⏳ Verifying registration...";


  statusMessage.textContent =
    "";


  registrationIdBox.textContent =
    registrationId;


  participantBox.classList.add(
    "hidden"
  );


  nextButton.classList.add(
    "hidden"
  );


  statusBox.style.display =
    "block";

}


/****************************************************
 * SHOW RESULT
 ****************************************************/

function showResult(
  result
) {

  const type =
    result.type ||
    "ERROR";


  statusBox.className =
    "status";


  participantBox.innerHTML =
    "";


  participantBox.classList.add(
    "hidden"
  );


  registrationIdBox.textContent =
    result.registrationId ||
    "";


  /**************************************************
   * VALID
   **************************************************/

  if (
    type ===
    "VALID"
  ) {

    statusBox.classList.add(
      "valid"
    );


    statusTitle.textContent =
      "✅ CHECK-IN SUCCESSFUL";


    statusMessage.textContent =
      result.message ||
      "Registration verified.";


    showParticipant(
      result.participant
    );


    vibrate();


  }


  /**************************************************
   * ALREADY CHECKED IN
   **************************************************/

  else if (
    type ===
    "ALREADY_CHECKED_IN"
  ) {

    statusBox.classList.add(
      "duplicate"
    );


    statusTitle.textContent =
      "⚠️ ALREADY CHECKED IN";


    statusMessage.textContent =
      result.message ||
      "This registration has already been checked in.";


    showParticipant(
      result.participant
    );


    if (
      result.checkInTime
    ) {

      statusMessage.innerHTML +=
        "<br><br><strong>Time:</strong> " +
        escapeHtml(
          result.checkInTime
        );

    }


    if (
      result.checkedInBy
    ) {

      statusMessage.innerHTML +=
        "<br><strong>Staff:</strong> " +
        escapeHtml(
          result.checkedInBy
        );

    }


    vibrate();

  }


  /**************************************************
   * INVALID
   **************************************************/

  else if (
    type ===
    "INVALID"
  ) {

    statusBox.classList.add(
      "invalid"
    );


    statusTitle.textContent =
      "❌ INVALID REGISTRATION";


    statusMessage.textContent =
      result.message ||
      "Registration not found.";


    vibrate();

  }


  /**************************************************
   * UNAUTHORIZED
   **************************************************/

  else if (
    type ===
    "UNAUTHORIZED"
  ) {

    statusBox.classList.add(
      "invalid"
    );


    statusTitle.textContent =
      "🔒 INVALID STAFF PIN";


    statusMessage.textContent =
      result.message ||
      "Invalid staff PIN.";

  }


  /**************************************************
   * BUSY
   **************************************************/

  else if (
    type ===
    "BUSY"
  ) {

    statusBox.classList.add(
      "error"
    );


    statusTitle.textContent =
      "⏳ SYSTEM BUSY";


    statusMessage.textContent =
      result.message ||
      "Please scan again.";

  }


  /**************************************************
   * OTHER ERROR
   **************************************************/

  else {

    statusBox.classList.add(
      "error"
    );


    statusTitle.textContent =
      "⚠️ CHECK-IN ERROR";


    statusMessage.textContent =
      result.message ||
      "Something went wrong.";

  }


  statusBox.style.display =
    "block";


  nextButton.classList.remove(
    "hidden"
  );


  processingScan =
    false;

}


/****************************************************
 * PARTICIPANT DETAILS
 ****************************************************/

function showParticipant(
  participant
) {

  if (
    !participant ||
    Object.keys(
      participant
    ).length === 0
  ) {

    return;

  }


  participantBox.innerHTML =
    "";


  for (
    const key in participant
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "participant-row";


    row.innerHTML =

      "<strong>" +

      escapeHtml(
        key
      ) +

      ":</strong> " +

      escapeHtml(
        participant[key]
      );


    participantBox.appendChild(
      row
    );

  }


  participantBox.classList.remove(
    "hidden"
  );

}


/****************************************************
 * NEXT PARTICIPANT
 ****************************************************/

nextButton.addEventListener(
  "click",
  async function() {

    statusBox.style.display =
      "none";


    participantBox.classList.add(
      "hidden"
    );


    registrationIdBox.textContent =
      "";


    nextButton.classList.add(
      "hidden"
    );


    processingScan =
      false;


    try {

      await startScanner();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Could not restart camera.\n\n" +
        error.message
      );

    }

  }
);


/****************************************************
 * STOP SCANNER
 ****************************************************/

async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await scanner.stop();


  } catch (error) {

    console.warn(
      "Scanner stop error:",
      error
    );

  }


  scannerRunning =
    false;


  scanner.clear();

}


/****************************************************
 * VIBRATION
 ****************************************************/

function vibrate() {

  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      200
    );

  }

}


/****************************************************
 * HTML ESCAPE
 ****************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
